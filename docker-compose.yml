services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: huntr_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    env_file:
      - path: .env.local
        format: raw
    depends_on:
      - db
      - cache
    networks:
      - huntr_network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: huntr_web
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - huntr_network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: huntr_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: huntr
      POSTGRES_USER: huntr
      POSTGRES_PASSWORD: manchester@2025
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - huntr_network

  # Dragonfly Cache (Fast Redis-compatible store)
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: huntr_cache
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    networks:
      - huntr_network

  # Laravel Horizon (Queue worker)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: huntr_horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www
    env_file:
      - path: .env.local
        format: raw
    depends_on:
      - db
      - cache
    networks:
      - huntr_network

  # Laravel Reverb (WebSocket server)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: huntr_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www
    env_file:
      - path: .env.local
        format: raw
    depends_on:
      - cache
    networks:
      - huntr_network

  # Per-tenant whatsapp-web.js sessions for CRM.
  whatsapp:
    build:
      context: ./services/crm-whatsapp
      dockerfile: Dockerfile
    container_name: huntr_whatsapp
    restart: unless-stopped
    env_file:
      - path: .env.local
        format: raw
    environment:
      PORT: 3100
      WHATSAPP_AUTH_PATH: /data/auth
      CRM_WHATSAPP_WEBHOOK_URL: http://web/api/crm/integrations/whatsapp/events
    volumes:
      - whatsapp_auth:/data/auth
    depends_on:
      - web
    networks:
      - huntr_network

volumes:
  pgdata:
    driver: local
  whatsapp_auth:
    driver: local

networks:
  huntr_network:
    driver: bridge
