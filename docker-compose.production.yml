services:
  # PHP Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        PHP_VERSION: "8.5"
    container_name: huntr_app_prod
    restart: unless-stopped
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --workers=auto --max-requests=10000
    volumes:
      - ./storage:/var/www/storage
      - ./.env.production:/var/www/.env:ro
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_started
      cache:
        condition: service_started
      whatsapp:
        condition: service_healthy

  # Nginx Web Server (Production)
  web:
    image: nginx:alpine
    container_name: huntr_web_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www # <--- WAJIB DITAMBAHKAN AGAR NGINX BISA BACA FOLDER PUBLIC LAREVEL
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: huntr_db_prod
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: huntr
      POSTGRES_USER: huntr
      POSTGRES_PASSWORD: manchester@2025
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Dragonfly Cache (Production)
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: huntr_cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Laravel Horizon (Production)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        PHP_VERSION: "8.5"
    container_name: huntr_horizon_prod
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./storage:/var/www/storage
      - ./.env.production:/var/www/.env:ro
    env_file:
      - .env.production
    depends_on:
      app:
        condition: service_started
      cache:
        condition: service_started
      db:
        condition: service_started

  # Laravel Reverb (Production)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        PHP_VERSION: "8.5"
    container_name: huntr_reverb_prod
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/var/www/storage
      - ./.env.production:/var/www/.env:ro
    env_file:
      - .env.production
    depends_on:
      app:
        condition: service_started
      cache:
        condition: service_started

  whatsapp:
    build:
      context: ./services/crm-whatsapp
      dockerfile: Dockerfile
    container_name: huntr_whatsapp_prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: 3100
      WHATSAPP_REMOTE_AUTH_PATH: /tmp/whatsapp-remote-auth
      CRM_WHATSAPP_WEBHOOK_URL: http://web/api/crm/integrations/whatsapp/events
      CRM_WHATSAPP_API_URL: http://web/api/crm
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata: # <--- Tempat penyimpanan database aman
