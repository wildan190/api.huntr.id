services:
  # PHP Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: huntr_app_prod
    volumes:
      - .:/var/www
      - /var/www/vendor
    env_file:
      - .env.production
    depends_on:
      - db
      - cache

  # Nginx Web Server (Production)
  web:
    image: nginx:alpine
    container_name: huntr_web_prod
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www # <--- WAJIB DITAMBAHKAN AGAR NGINX BISA BACA FOLDER PUBLIC LAREVEL
    depends_on:
      - app

  # PostgreSQL Database (Production)
  db:
    image: postgres:16-alpine
    container_name: huntr_db_prod
    environment:
      POSTGRES_DB: huntr
      POSTGRES_USER: huntr
      POSTGRES_PASSWORD: manchester@2025
    volumes:
      - pgdata:/var/lib/postgresql/data # <--- Direkomendasikan agar data DB tidak hilang saat container di-restart

  # Dragonfly Cache (Production)
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: huntr_cache
    ports:
      - "6379:6379"

  # Laravel Horizon (Production)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: huntr_horizon_prod
    command: php artisan horizon
    volumes:
      - .:/var/www
      - /var/www/vendor # <--- Mencegah error 'vendor/autoload.php not found' di Horizon
    env_file:
      - .env.production
    depends_on:
      - app

  # Laravel Reverb (Production)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: huntr_reverb_prod
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www
      - /var/www/vendor # <--- Mencegah error 'vendor/autoload.php not found' di Reverb
    env_file:
      - .env.production
    depends_on:
      - app

volumes:
  pgdata: # <--- Tempat penyimpanan database aman