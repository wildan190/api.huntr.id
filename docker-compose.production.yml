services:
  # PHP Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: huntr_app_prod
    volumes: []
    env_file:
      - .env.production

  # Nginx Web Server (Production)
  web:
    image: nginx:alpine
    container_name: huntr_web_prod
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

  # PostgreSQL Database (Production)
  db:
    image: postgres:16-alpine
    container_name: huntr_db_prod
    environment:
      POSTGRES_DB: huntr
      POSTGRES_USER: huntr
      POSTGRES_PASSWORD: manchester@2025

  # Dragonfly Cache (Production)
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: huntr_cache
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    networks:
      - huntr_network

  # Laravel Horizon (Production)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: huntr_horizon_prod
    command: php artisan horizon
    volumes:
      - .:/var/www
    env_file:
      - .env.production
    depends_on:
      - db
      - cache
    networks:
      - huntr_network

  # Laravel Reverb (Production)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: huntr_reverb_prod
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes: []
    env_file:
      - .env.production
