# ==============================================================================
# SERVER BLOCK 1: Mengalihkan semua lalu lintas HTTP (80) ke HTTPS (443)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.huntr.id;

    # Jalur khusus untuk verifikasi perpanjangan otomatis SSL oleh Certbot (.well-known)
    location /.well-known/acme-challenge/ {
        root /var/www/public;
    }

    # Alihkan sisanya ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK 2: Konfigurasi Utama HTTPS (443) dengan SSL Let's Encrypt
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.huntr.id;
    
    # Jalur absolut ke folder public Laravel di dalam kontainer Nginx
    root /var/www/public;

    # Konfigurasi Sertifikat SSL (Folder ini di-mount dari VPS ke Docker)
    ssl_certificate /etc/letsencrypt/live/api.huntr.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.huntr.id/privkey.pem;

    # Protokol SSL & Ciphers yang Aman (Rekomendasi Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Security headers (Sudah diizinkan 'unsafe-eval' untuk Laravel Horizon)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    index index.php;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Memproses file PHP-FPM ke kontainer aplikasi
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # Optimize FastCGI buffer sizes for performance
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Melarang akses ke file tersembunyi (seperti .env atau .git), KECUALI .well-known untuk Certbot
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|eot|ttf|otf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}