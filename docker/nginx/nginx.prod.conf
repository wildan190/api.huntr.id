map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==============================================================================
# SERVER BLOCK 1: Mengalihkan semua lalu lintas HTTP (80) ke HTTPS (443)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.huntr.id;

    # Jalur khusus untuk verifikasi perpanjangan otomatis SSL oleh Certbot (.well-known)
    location /.well-known/acme-challenge/ {
        root /var/www/public;
    }

    # Alihkan sisanya ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# SERVER BLOCK 2: Konfigurasi Utama HTTPS (443) dengan SSL Let's Encrypt
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.huntr.id;
    
    # Jalur absolut ke folder public Laravel di dalam kontainer Nginx
    root /var/www/public;

    # Konfigurasi Sertifikat SSL (Folder ini di-mount dari VPS ke Docker)
    ssl_certificate /etc/letsencrypt/live/api.huntr.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.huntr.id/privkey.pem;

    # Protokol SSL & Ciphers yang Aman (Rekomendasi Modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # Security headers (Sudah diizinkan 'unsafe-eval' untuk Laravel Horizon)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    index index.php;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # ==============================================================================
    # Konfigurasi Proxy untuk Laravel Reverb (WebSocket)
    # ==============================================================================
    location /app {
        proxy_pass             http://reverb:8080;
        proxy_read_timeout     60s;
        proxy_connect_timeout  60s;
        proxy_redirect         off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apps {
        proxy_pass             http://reverb:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location /index.php {
        try_files /not_exists @octane;
    }

    location / {
        try_files $uri $uri/ @octane;
    }

    location @octane {
        set $suffix "";
        if ($uri = /index.php) {
            set $suffix ?$query_string;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_pass http://app:8000$suffix;
    }

    # Melarang akses ke file tersembunyi (seperti .env atau .git), KECUALI .well-known untuk Certbot
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|eot|ttf|otf)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }
}